[project]
name = "finance_insight_lite"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    # Core RAG & LLM
    "langchain>=1.2.0",
    "langchain-core>=0.2.0",
    "langchain-groq>=1.1.0",
    "langchain-huggingface>=1.2.0",
    "langchain-community>=0.4.0",
    "langchain-text-splitters>=0.2.0",
    "groq>=0.37.0",
    
    # Vector Database & Search
    "chromadb>=1.4.0",
    "faiss-cpu>=1.13.0",
    
    # Document Processing
    "pymupdf>=1.26.0",
    "pandas>=2.3.0",
    "openpyxl>=3.10.0",
    
    # Text Processing & Embeddings
    "sentence-transformers>=5.2.0",
    "transformers>=4.57.0",
    "numpy>=2.4.0",
    
    # Data Visualization
    "plotly>=5.18.0",
    
    # Web Interface
    "streamlit>=1.28.0",
    "rich>=14.0.0",
    
    # API & Server
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    
    # Configuration & Environment
    "python-dotenv>=1.2.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    
    # Utilities
    "requests>=2.32.0",
    "typer>=0.21.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_insight_lite"]
