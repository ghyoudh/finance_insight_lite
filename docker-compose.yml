version: '3.8'

services:
  # FastAPI Backend
  api:
    build: .
    container_name: finance-insight-api
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app:/app/src
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    command: >
      uvicorn main:app 
      --host 0.0.0.0 
      --port 8000 
      --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - finance-network
    restart: unless-stopped

  # Streamlit UI
  ui:
    build: .
    container_name: finance-insight-ui
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app:/app/src
    volumes:
      - ./.env:/app/.env:ro
    command: >
      streamlit run src/ui.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
    depends_on:
      api:
        condition: service_healthy
    networks:
      - finance-network
    restart: unless-stopped

networks:
  finance-network:
    driver: bridge

volumes:
  data:
    driver: local